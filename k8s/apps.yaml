# FIAP X Video API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-api
  namespace: fiapx
  labels:
    app: fiapx-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiapx-api
  template:
    metadata:
      labels:
        app: fiapx-api
    spec:
      containers:
        - name: api
          image: fiapx-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fiapx-config
            - secretRef:
                name: fiapx-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fiapx-api
  namespace: fiapx
spec:
  type: ClusterIP
  selector:
    app: fiapx-api
  ports:
    - port: 8080
      targetPort: 8080
---
# FIAP X Video Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiapx-worker
  namespace: fiapx
  labels:
    app: fiapx-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fiapx-worker
  template:
    metadata:
      labels:
        app: fiapx-worker
    spec:
      containers:
        - name: worker
          image: fiapx-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fiapx-config
            - secretRef:
                name: fiapx-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
# Horizontal Pod Autoscaler (HPA) para o Worker de Processamento de Vídeos
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiapx-worker-hpa
  namespace: fiapx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiapx-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Horizontal Pod Autoscaler (HPA) para a API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fiapx-api-hpa
  namespace: fiapx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fiapx-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
